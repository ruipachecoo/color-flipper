<div
  class="min-h-dvh flex items-center justify-center p-4 transition-colors duration-500"
  [style.background-color]="currentColor()"
>
  <div class="flex flex-col items-center gap-6 text-center">
    <h1 class="text-3xl sm:text-4xl font-bold" [class]="textColorClass()">
      Color Flipper
    </h1>

    <div
      class="bg-slate-900/80 backdrop-blur-sm rounded-lg px-6 py-4"
      [class]="textColorClass()"
    >
      <p class="text-sm uppercase tracking-widest opacity-70">Current color</p>
      <p class="text-2xl sm:text-3xl font-mono font-bold">
        {{ currentColor() }}
      </p>
    </div>

    <button
      (click)="generateNewColor()"
      [class]="textColorClass()"
      class="px-6 py-3 rounded-lg border-2 border-current font-semibold text-sm sm:text-base uppercase tracking-wider transition-all duration-150 hover:scale-105 active:scale-95"
    >
      Click Me
    </button>
  </div>
</div>
